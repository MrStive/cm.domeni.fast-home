import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
buildscript {
	dependencies {
		classpath("org.openapitools:openapi-generator-gradle-plugin:7.1.0")
	}
}
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id "org.openapi.generator" version "7.1.0"
	id 'com.diffplug.spotless' version '6.25.0'

}

group = 'cm.domeni'
version = '0.0.1-SNAPSHOT'

apply plugin: 'com.diffplug.spotless'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('mapstructVersion', "1.5.5.Final")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa:4.0.2'

	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	// Mapstruct
	implementation("org.mapstruct:mapstruct:${mapstructVersion}")
	annotationProcessor("org.mapstruct:mapstruct-processor:${mapstructVersion}")
	testAnnotationProcessor("org.mapstruct:mapstruct-processor:${mapstructVersion}")
	//postgres
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	// OPENAPI
	implementation('io.swagger:swagger-annotations:1.6.11')
	implementation('org.openapitools:jackson-databind-nullable:0.2.6')
	implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0')
	// H2 database for both testing and development
	implementation 'com.h2database:h2'
	// Cucumber for e2e testing
	testImplementation 'io.cucumber:cucumber-java:7.14.0'
	testImplementation 'io.cucumber:cucumber-junit:7.14.0'
	testImplementation 'io.cucumber:cucumber-spring:7.14.0'
	testImplementation 'io.rest-assured:rest-assured:5.3.2'
	testImplementation 'io.rest-assured:spring-mock-mvc:5.4.0'
//	// Liquibase for database migrations
//	implementation 'org.liquibase:liquibase-core'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}

openApiGenerate {
	generatorName = "spring"
	inputSpec = "$rootDir/openapi/main.yaml".toString()
	outputDir = layout.buildDirectory.file("generated/sources/openapi").get().asFile.path
	apiPackage = "cm.domeni.fast_home.api"
	modelPackage = "cm.domeni.fast_home.dto"
	configOptions = [
			dateLibrary         : "java8-localdatetime",
			library             : "spring-boot",
			interfaceOnly       : "true",
			useTags             : "true",
			skipDefaultInterface: "true",
			useSpringBoot3      : "true",
			openApiNullable     : "false"
	]
	typeMappings = [
			time: "java.time.LocalTime",
	]
}

sourceSets.main.java.srcDir layout.buildDirectory.file("generated/sources/openapi/src/main/java").get().asFile.path

compileJava.dependsOn(
		tasks.openApiGenerate
)
tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}


spotless {
	java {
		toggleOffOn()
		googleJavaFormat("1.25.2")
				.reflowLongStrings()
				.formatJavadoc(true)
				.reorderImports(true)
				.groupArtifact("com.google.googlejavaformat:google-java-format")
		// Exclude generated code from spotless checks
		targetExclude("build/generated/**/*.java")
	}

	tasks.spotlessJava.dependsOn(tasks.openApiGenerate)
	kotlin {
		target("**/*.kts")
		ktlint("1.5.0")
	}

	yaml {
		target("src/*/resources/**/*.yaml", "src/*/resources/**/*.yml", "openapi/main.yaml")
		jackson()
				.feature("ORDER_MAP_ENTRIES_BY_KEYS", true)
	}
	gherkin {
		target("src/test/resources/**/*.feature")
		gherkinUtils()
				.version("9.0.0")
	}
}
